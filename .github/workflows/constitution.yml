name: constitution

# The wall. `fux gate` exits 2 on any constitutional-tier finding — a tampered or
# unsealed apex rule (plan-store: money docs / hard PII must never enter this public
# repo). Local pre-commit is bypassable with `--no-verify`; this required check is not.
# Mark "constitution / gate" a required status check in branch protection for `main`.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is REQUIRED. `fux gate` staleness is a *blocking* finding,
          # and it derives each governed file's change date from `git log`. A shallow
          # (depth-1) checkout collapses every file's last-change to the PR HEAD commit,
          # so every rule whose `updated:` predates HEAD falsely reports stale → red gate.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install fux-engine (exact pin — see fux-engine-exact-pin rule)
        run: pip install "fux-engine==0.16.0"

      - uses: extractions/setup-just@v2

      - name: just constitution (fux gate — exit 2 blocks)
        run: just constitution

      - name: plan-store content guard (money docs / hard PII — exit 1 blocks)
        # `fux gate` checks constitutional RULE integrity, not file CONTENT — so a
        # money doc committed with `--no-verify` (bypassing the local dante-pii hook)
        # would otherwise sail through CI. This pure-stdlib probe is the CI-side twin
        # of the pre-commit `dante pii` / `just probe plan-safety` guard: it FAILS
        # (exit 1) if any *.plan.md / *.drift.md is tracked or a committed rule doc
        # leaks data-plane figures. (dante itself is a local sibling tool, not a pip
        # package, so it can't run in CI — see docs/guardrails.md residual-gap note.)
        run: python probes/plan_safety_probe.py

  ai-review:
    # The second-set-of-eyes review (§2R.1 of docs/constitution-enforcement-handoff.md).
    # A solo author can't approve his own PR, so the missing human approval is
    # enforced as a CHECK: a separate reviewer identity reviews the PR diff against
    # the constitution and exits non-zero on problems. REFUSES (exit 3) if
    # reviewer == PR author (separation of duties). Required alongside `gate` — see
    # .github/branch-protection.json. PRs only (needs an author to check against).
    # The required-check context is the BARE job name "ai-review".
    name: ai-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need base sha to diff the PR

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install fux-engine (exact pin — see fux-engine-exact-pin rule)
        run: pip install "fux-engine==0.16.0"

      - name: Constitutional review of the PR diff (separation of duties enforced)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: anton-ci-reviewer
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ai-review.sh
