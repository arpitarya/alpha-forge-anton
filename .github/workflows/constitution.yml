name: constitution

# The wall. `fux gate` exits 2 on any constitutional-tier finding — a tampered or
# unsealed apex rule (plan-store: money docs / hard PII must never enter this public
# repo). Local pre-commit is bypassable with `--no-verify`; this required check is not.
# Mark "constitution / gate" a required status check in branch protection for `main`.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth: 0 — constitutional tamper/lock findings are content-hash
        # based (history-independent). Git history only feeds advisory staleness.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install fux-engine (pinned in pyproject.toml)
        run: pip install "fux-engine>=0.4.0"

      - uses: extractions/setup-just@v2

      - name: just constitution (fux gate — exit 2 blocks)
        run: just constitution

  ai-review:
    # The second-set-of-eyes review (§2R.1 of docs/constitution-enforcement-handoff.md).
    # A solo author can't approve his own PR, so the missing human approval is
    # enforced as a CHECK: a separate reviewer identity reviews the PR diff against
    # the constitution and exits non-zero on problems. REFUSES (exit 3) if
    # reviewer == PR author (separation of duties). Required alongside `gate` — see
    # .github/branch-protection.json. PRs only (needs an author to check against).
    # The required-check context is the BARE job name "ai-review".
    name: ai-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need base sha to diff the PR

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install fux-engine (pinned in pyproject.toml)
        run: pip install "fux-engine>=0.4.0"

      - name: Constitutional review of the PR diff (separation of duties enforced)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: anton-ci-reviewer
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ai-review.sh
