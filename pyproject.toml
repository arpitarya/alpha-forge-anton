[project]
name = "alphaforge-anton"
version = "0.0.0"
description = "AlphaForge Anton — workspace root (uv). Not a published package."
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arpit Arya" }]

# The root project has no runtime deps; member projects own their own.
dependencies = []

[tool.uv.workspace]
members = [
    "backend",
    "packages/logger-py",
    "news",
    "concierge/llm",
]

# Local workspace deps resolve to the in-tree member, not PyPI.
[tool.uv.sources]
alphaforge-anton-backend = { workspace = true }
alphaforge-logger  = { workspace = true }
alphaforge-anton-news    = { workspace = true }
alphaforge-anton-llm     = { workspace = true }
alphaforge-dante         = { path = "../dante" }

# Pull every workspace member into `.venv` on `uv sync`.
[tool.uv]
default-groups = ["all", "dev"]

[dependency-groups]
all = [
    "alphaforge-anton-backend",
    "alphaforge-logger",
    "alphaforge-anton-news",
    "alphaforge-anton-llm",
]
dev = [
    "ruff>=0.6.0",
    "pyrefly>=1.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ipython>=8.0",
    "nbstripout>=0.7",
    "nbdime>=4.0",
    "jupytext>=1.16",
    "pip-audit>=2.7.0",
]

[tool.pyrefly]
project_includes = [
    "backend/app",
    "packages/logger-py/src",
    "mcp/src",
]
python_version = "3.14"
