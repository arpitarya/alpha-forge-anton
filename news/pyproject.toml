[project]
name = "alphaforge-news"
version = "0.1.0"
description = "AlphaForge — Indian market news aggregator (standalone package)"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arpit Arya" }]

dependencies = [
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
reddit = ["asyncpraw>=7.7.0"]
yfinance = ["yfinance>=0.2.0"]
all = ["asyncpraw>=7.7.0", "yfinance>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaforge_news"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
