<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-top" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#16140f"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="18%" r="60%">
      <stop offset="0%"   stop-color="#ff8f00" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB454"/>
      <stop offset="55%"  stop-color="#F38A2B"/>
      <stop offset="100%" stop-color="#D45A1A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect width="120" height="120" rx="28"/>
    </clipPath>
  </defs>

  <!-- tile background -->
  <rect width="120" height="120" rx="28" fill="url(#bg-top)"/>
  <rect width="120" height="120" rx="28" fill="url(#bg-glow)"/>
  <!-- top sheen -->
  <rect width="120" height="60"  rx="28" clip-path="url(#tile-clip)" fill="url(#sheen)"/>
  <!-- border -->
  <rect width="120" height="120" rx="28" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <!-- mark, centred in tile — viewBox 64×64 scaled to 78px, offset to centre -->
  <g transform="translate(21, 21) scale(1.21875)">
    <rect x="9"    y="52.5" width="46"  height="2.6"  rx="1.3" fill="#000" opacity=".22"/>
    <rect x="11"   y="40"   width="9"   height="12.5" rx="1.6" fill="url(#g)"/>
    <rect x="27.5" y="30"   width="9"   height="22.5" rx="1.6" fill="url(#g)"/>
    <rect x="44"   y="21"   width="9"   height="31.5" rx="1.6" fill="url(#g)"/>
    <path d="M41.5 22 L55.5 22 L48.5 9 Z"                      fill="url(#g)"/>
    <rect x="44"   y="21"   width="2.6" height="31.5" rx="1.3" fill="#fff" opacity=".2"/>
    <rect x="27.5" y="30"   width="2.4" height="22.5" rx="1.2" fill="#fff" opacity=".14"/>
  </g>
</svg>
